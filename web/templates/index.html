<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market State Trader</title>
<style>
:root{--bg:#0a0a0d;--card:#131318;--border:#26262f;--text:#edecea;--muted:#8b8a94;
  --accent:#f7931a;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;
  --phase1:#a78bfa;--phase2:#60a5fa;--phase3:#34d399;--phase4:#fbbf24;
  --radius:10px;--font:-apple-system,BlinkMacSystemFont,sans-serif;--mono:ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;padding:10px 14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top h1{font-size:1rem;font-weight:700}
.pill{padding:2px 7px;border-radius:99px;font-size:.6rem;font-weight:700;text-transform:uppercase}
.pill.on{background:rgba(52,211,153,0.15);color:var(--green)}
.pill.off{background:var(--card);color:var(--muted)}
.spacer{flex:1}
button{background:var(--accent);color:#000;border:none;padding:4px 10px;border-radius:5px;cursor:pointer;font-weight:600;font-size:.74rem}
button.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
button:disabled{opacity:.4}
.price{font-family:var(--mono);font-size:1.5rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px}
.card h2{font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.ph-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:.5rem;font-weight:700;letter-spacing:.04em}
.ph1{background:rgba(167,139,250,0.25);color:var(--phase1)}.ph2{background:rgba(96,165,250,0.25);color:var(--phase2)}
.ph3{background:rgba(52,211,153,0.25);color:var(--phase3)}.ph4{background:rgba(251,191,36,0.25);color:var(--phase4)}
.row{display:flex;justify-content:space-between;padding:1px 0;border-bottom:1px dashed var(--border);font-size:.74rem}
.row:last-child{border:none}.row .lbl{color:var(--muted)}.row .val{font-family:var(--mono);font-weight:600}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.muted{color:var(--muted)}
.ctx-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:.65rem;font-weight:700;text-transform:uppercase}
.ctx-continuation{background:rgba(52,211,153,0.2);color:var(--green)}
.ctx-mean_reversion{background:rgba(96,165,250,0.2);color:var(--blue)}
.ctx-extended{background:rgba(248,113,113,0.2);color:var(--red)}
.ctx-compressed{background:rgba(251,191,36,0.2);color:var(--yellow)}
.ctx-transition{background:var(--card);color:var(--muted)}
.state-toggle{cursor:pointer;color:var(--accent);font-size:.68rem}
.state-detail{display:none;margin-top:3px}
.state-detail.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:3px}
.sb{background:var(--bg);border-radius:4px;padding:3px 5px;font-size:.6rem}
.sb .t{font-size:.53rem;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:1px}
.sb .r{display:flex;justify-content:space-between;padding:0;font-size:.58rem}
.sb .r span:first-child{color:var(--muted)}.sb .r .v{font-family:var(--mono);font-weight:600}
canvas#chart{width:100%;height:170px;display:block;border-radius:6px;margin:4px 0}
.log{max-height:120px;overflow-y:auto;font-family:var(--mono);font-size:.64rem;line-height:1.5}
.log .INFO{color:var(--muted)}.log .TRADE{color:var(--accent)}.log .ERROR{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:.64rem;margin-top:2px}
th{text-align:left;padding:2px 4px;border-bottom:1px solid var(--border);color:var(--muted);font-size:.56rem;text-transform:uppercase}
td{padding:1px 4px;border-bottom:1px dashed var(--border);font-family:var(--mono)}
.section-bar{display:flex;align-items:center;gap:6px;margin:8px 0 4px;padding:2px 0;border-top:1px solid var(--border)}
.section-bar span{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:3px}
.tf-select{display:inline-flex;gap:2px}
.tf-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);padding:2px 6px;border-radius:3px;font-size:.56rem;cursor:pointer;font-family:var(--mono)}
.tf-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
</style>
</head>
<body>
<div class="top">
  <h1>⚡ Market State Trader</h1>
  <span class="pill off" id="run-pill">stopped</span>
  <div class="spacer"></div>
  <span class="tf-select">
    <button class="tf-btn active" onclick="setTF('1m',this)">1m</button>
    <button class="tf-btn" onclick="setTF('15m',this)">15m</button>
    <button class="tf-btn" onclick="setTF('1h',this)">1h</button>
    <button class="tf-btn" onclick="setTF('4h',this)">4h</button>
  </span>
  <button onclick="startTrader()" id="btn-start">▶ Start</button>
  <button onclick="stopTrader()" id="btn-stop" class="ghost" disabled>■ Stop</button>
</div>

<div style="margin-bottom:6px"><span class="price num" id="price">--</span></div>
<canvas id="chart"></canvas>

<div class="section-bar"><span style="color:var(--phase1);background:rgba(167,139,250,0.15)">P1 · Observation</span></div>
<div class="card">
  <h2><span class="ph-badge ph1">P1</span> Market State <span id="state-toggle" class="state-toggle" onclick="toggleState()">▶ Show</span></h2>
  <div class="state-detail" id="state-detail"></div>
</div>

<div class="section-bar"><span style="color:var(--phase2);background:rgba(96,165,250,0.15)">P2 · Analysis</span></div>
<div class="grid">
  <div class="card">
    <h2><span class="ph-badge ph2">P2</span> Context Performance (4h)</h2>
    <div id="ctx-perf">--</div>
  </div>
  <div class="card">
    <h2><span class="ph-badge ph2">P2</span> Candidates</h2>
    <div id="cand-info">--</div>
  </div>
</div>

<div class="section-bar"><span style="color:var(--phase3);background:rgba(52,211,153,0.15)">P3 · Context Classification</span></div>
<div class="card" style="margin-bottom:6px">
  <h2><span class="ph-badge ph3">P3</span> Market Context</h2>
  <div id="context-info">--</div>
</div>

<div class="section-bar"><span style="color:var(--phase4);background:rgba(251,191,36,0.15)">P4 · Strategy Decision</span></div>
<div class="grid">
  <div class="card">
    <h2><span class="ph-badge ph4">P4</span> Trading Decision</h2>
    <div id="decision-info">--</div>
  </div>
  <div class="card">
    <h2>Portfolio</h2>
    <div id="portfolio-info">--</div>
  </div>
  <div class="card">
    <h2>Position</h2>
    <div id="position-info">--</div>
  </div>
</div>

<div class="card" style="margin-top:6px">
  <h2>Trade History</h2>
  <div id="trade-history" style="max-height:100px;overflow-y:auto">--</div>
</div>

<div class="card" style="margin-top:6px">
  <h2>Event Log</h2>
  <div class="log" id="log"></div>
</div>

<script>
let _lastStatus=null,_stateOpen=false,_chartTF='1m',_chartData=[];

function fmt$(v,d=2){return v==null?'--':'$'+Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtPct(v,d=2){return v==null?'--':(v>=0?'+':'')+Number(v).toFixed(d)+'%'}
function fmtNum(v,d=4){return v==null?'--':Number(v).toFixed(d)}
function cls(v){return v>=0?'green':'red'}

let ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='status')render(m.data)};
ws.onclose=()=>setTimeout(()=>{ws=new WebSocket(ws.url)},3000);

function setTF(tf,btn){
  _chartTF=tf;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(_lastStatus) updateChart(_lastStatus.ohlcv||{});
}

function render(s){
  _lastStatus=s;
  document.getElementById('run-pill').className='pill '+(s.running?'on':'off');
  document.getElementById('run-pill').textContent=s.running?'running · '+s.cycle:'stopped';
  document.getElementById('btn-start').disabled=s.running;
  document.getElementById('btn-stop').disabled=!s.running;
  document.getElementById('price').textContent=fmt$(s.price);

  updateChart(s.ohlcv||{});

  const p=s.paper||{};
  document.getElementById('portfolio-info').innerHTML=`
    <div class="row"><span class="lbl">Balance</span><span class="val">${fmt$(p.balance)}</span></div>
    <div class="row"><span class="lbl">Equity</span><span class="val">${fmt$(p.equity)}</span></div>
    <div class="row"><span class="lbl">Total PnL</span><span class="val ${cls(p.total_pnl)}">${fmt$(p.total_pnl)}</span></div>
    <div class="row"><span class="lbl">Trades</span><span class="val">${p.trade_count||0}</span></div>`;

  const pos=p.position;
  if(pos) document.getElementById('position-info').innerHTML=`
    <div class="row"><span class="lbl">Side</span><span class="val ${pos.side==='long'?'green':'red'}">${pos.side.toUpperCase()} ${pos.leverage}x</span></div>
    <div class="row"><span class="lbl">Entry</span><span class="val">${fmt$(pos.entry_price)}</span></div>
    <div class="row"><span class="lbl">uPnL</span><span class="val ${cls(pos.unrealized_pnl)}">${fmt$(pos.unrealized_pnl)} (${fmtPct(pos.roe_pct)})</span></div>
    <div class="row"><span class="lbl">SL / TP</span><span class="val"><span class="red">${fmt$(pos.stop_loss)}</span> / <span class="green">${fmt$(pos.take_profit)}</span></span></div>`;
  else document.getElementById('position-info').innerHTML='<div class="muted">No position</div>';

  const ctx=s.context;
  if(ctx) document.getElementById('context-info').innerHTML=`
    <div style="margin-bottom:2px"><span class="ctx-badge ctx-${ctx.name}">${ctx.name.replace('_',' ')}</span></div>
    <div class="row"><span class="lbl">Bias</span><span class="val">${ctx.direction_bias}</span></div>
    <div class="row"><span class="lbl">Confidence</span><span class="val">${fmtNum(ctx.confidence,2)}</span></div>
    <div style="margin-top:2px;font-size:.64rem;color:var(--muted)">${ctx.rationale}</div>`;

  const dec=s.decision;
  if(dec) document.getElementById('decision-info').innerHTML=`
    <div class="row"><span class="lbl">Action</span><span class="val ${dec.action.includes('long')?'green':dec.action.includes('short')?'red':''}">${dec.action}</span></div>
    <div class="row"><span class="lbl">Confidence</span><span class="val">${fmtNum(dec.confidence,2)}</span></div>
    ${dec.sl_pct>0?`<div class="row"><span class="lbl">SL/TP</span><span class="val">${fmtPct(dec.sl_pct*100,0)} / ${fmtPct(dec.tp_pct*100,0)}</span></div>`:''}
    <div style="margin-top:2px;font-size:.64rem;color:var(--muted)">${dec.reason}</div>`;

  const cands=s.candidates||{};
  document.getElementById('cand-info').innerHTML=`
    <div class="row"><span class="lbl">Total</span><span class="val">${cands.total||0}</span></div>
    <div class="row"><span class="lbl">With 4h</span><span class="val">${cands.with_outcome_4h||0}</span></div>
    <div class="row"><span class="lbl">4h WR</span><span class="val">${cands.win_rate_4h!=null?(cands.win_rate_4h*100).toFixed(0)+'%':'--'}</span></div>`;

  const byCtx=cands.by_context||{};
  let ch='';
  for(const[nm,st] of Object.entries(byCtx)){
    const w=st.win_rate!=null?(st.win_rate*100).toFixed(0)+'%':'--';
    const e=st.mean_return!=null?(st.mean_return*100).toFixed(3)+'%':'--';
    ch+=`<div class="row"><span class="ctx-badge ctx-${nm}" style="font-size:.55rem">${nm}</span><span class="val">${st.with_4h||0} · WR ${w} · E ${e}</span></div>`;
  }
  document.getElementById('ctx-perf').innerHTML=ch||'<div class="muted">No data yet</div>';

  const trades=s.trade_history||[];
  let th=trades.length?'<table><tr><th>Time</th><th>Side</th><th>PnL</th><th>Reason</th></tr>':'';
  trades.slice(-8).reverse().forEach(t=>{
    th+=`<tr><td>${(t.ts||'').substring(11,19)}</td><td class="${t.side==='long'?'green':'red'}">${t.side}</td><td class="${(t.pnl||0)>=0?'green':'red'}">${fmt$(t.pnl)}</td><td style="font-size:.58rem;color:var(--muted)">${t.reason||''}</td></tr>`;
  });
  if(trades.length)th+='</table>';
  document.getElementById('trade-history').innerHTML=th||'<div class="muted">No trades yet</div>';

  renderState(s.state);
  fetch('/api/log?limit=18').then(r=>r.json()).then(entries=>{
    document.getElementById('log').innerHTML=entries.map(e=>
      `<div class="${e.level}">[${(e.ts||'').substring(11,19)}] <b>${e.level}</b> ${e.msg}</div>`
    ).join('')||'<div class="muted">No entries</div>';
  });
}

function updateChart(ohlcv){
  const data=ohlcv[_chartTF]||[];
  if(!data.length)return;
  _chartData=data;
  const cvs=document.getElementById('chart');
  const dpr=window.devicePixelRatio||1,w=cvs.clientWidth,h=cvs.clientHeight||170;
  cvs.width=w*dpr;cvs.height=h*dpr;
  const ctx=cvs.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const vals=data.map(d=>d.c),min=Math.min(...vals)*0.9992,max=Math.max(...vals)*1.0008;
  const Y=v=>h-12-((v-min)/(max-min||1))*(h-22),X=i=>4+(i/(data.length-1))*(w-8);
  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){const y=10+i*(h-24)/3;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  // Gradient fill
  const first=data[0].c,last=data[data.length-1].c,up=last>=first;
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,up?'rgba(52,211,153,0.22)':'rgba(248,113,113,0.22)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0].c));
  data.forEach((d,i)=>ctx.lineTo(X(i),Y(d.c)));
  ctx.lineTo(X(data.length-1),h-10);ctx.lineTo(X(0),h-10);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  // Bright line
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0].c));
  data.forEach((d,i)=>ctx.lineTo(X(i),Y(d.c)));
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.8;ctx.stroke();
  // Dot with glow
  const lx=X(data.length-1),ly=Y(last);
  ctx.beginPath();ctx.arc(lx,ly,4,0,Math.PI*2);
  ctx.fillStyle=up?'#34d399':'#f87171';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();
  // Labels
  ctx.fillStyle='var(--muted)';ctx.font='9px var(--mono)';
  ctx.fillText('$'+max.toLocaleString(undefined,{maximumFractionDigits:0}),4,9);
  ctx.fillText('$'+min.toLocaleString(undefined,{maximumFractionDigits:0}),4,h-1);
}

function renderState(st){
  if(!st)return;
  const el=document.getElementById('state-detail');
  const h1=st.state_1h||{}, trend=h1.trend||{}, momentum=h1.momentum||{}, volatility=h1.volatility||{},
        priceLoc=h1.price_location||{}, exhaustion=h1.exhaustion||{}, ctx4h=st.context_4h||{}, micro=st.micro_1m||{};
  const b=[
    ['Candle',[['Dir',micro.candle_direction],['Body',fmtNum(micro.body_ratio,3)],['UpWick',fmtNum(micro.upper_wick_ratio,3)],['DnWick',fmtNum(micro.lower_wick_ratio,3)],['CloseLoc',fmtNum(micro.close_location,3)]]],
    ['Trend',[['Dir',trend.direction],['Strength',fmtNum(trend.strength,3)],['ADX',fmtNum(trend.adx,1)],['EMA X',fmtNum(trend.ema_cross_norm,4)]]],
    ['Momentum',[['Dir',momentum.direction],['Strength',fmtNum(momentum.strength,3)],['Accel',fmtNum(momentum.acceleration,3)],['RSI',fmtNum(momentum.rsi,1)],['Sqz',momentum.squeeze_fired?'YES':'no']]],
    ['Volatility',[['Regime',volatility.regime],['P(Storm)',fmtNum(volatility.prob_storm,3)],['ATR',fmtNum(volatility.atr_norm,5)]]],
    ['Price Loc',[['R20',fmtNum(priceLoc.range_position_20,3)],['R50',fmtNum(priceLoc.range_position_50,3)],['BB',fmtNum(priceLoc.bb_position,3)],['VWAP',fmtNum(priceLoc.vwap_distance,4)]]],
    ['Structure',[['Trend',ctx4h.structure_trend],['HH',ctx4h.hh?'✓':'--'],['HL',ctx4h.hl?'✓':'--'],['LH',ctx4h.lh?'✓':'--'],['LL',ctx4h.ll?'✓':'--']]],
    ['Exhaustion',[['Cycle',fmtNum(exhaustion.cycle_strength,3)],['UpRej',fmtNum(exhaustion.upper_rejection,3)],['DnRej',fmtNum(exhaustion.lower_rejection,3)],['T-M Div',fmtNum(exhaustion.trend_momentum_divergence,2)]]]
  ];
  el.innerHTML=b.map(([t,r])=>`<div class="sb"><div class="t">${t}</div>${r.map(([l,v])=>`<div class="r"><span>${l}</span><span class="v">${v||'--'}</span></div>`).join('')}</div>`).join('');
}

function toggleState(){_stateOpen=!_stateOpen;document.getElementById('state-detail').classList.toggle('open',_stateOpen);document.getElementById('state-toggle').textContent=_stateOpen?'▼ Hide':'▶ Show'}
async function startTrader(){await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"interval":30}'})}
async function stopTrader(){await fetch('/api/stop',{method:'POST'})}
window.addEventListener('resize',()=>{if(_chartData.length)updateChart(_lastStatus?.ohlcv||{})});
</script>
</body>
</html>
